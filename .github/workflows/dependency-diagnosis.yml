name: Temporary dependency diagnosis

on:
  push:
    branches: ['feat/slice-0-foundation']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit updated lockfile
        run: |
          echo 'LOCK_REGEN_START'
          base64 -w 0 package-lock.json
          echo
          echo 'LOCK_REGEN_END'
      - name: Audit summary and supported fixes
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log("VULNERABILITY_SUMMARY_BEGIN"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,items:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,via:v.via.map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range}),fixAvailable:v.fixAvailable}))},null,2)); console.log("VULNERABILITY_SUMMARY_END");'
          npm outdated --json > outdated.json || true
          node -e 'const x=require("./outdated.json"); console.log("OUTDATED_SUMMARY_BEGIN"); console.log(JSON.stringify(x,null,2)); console.log("OUTDATED_SUMMARY_END");'
