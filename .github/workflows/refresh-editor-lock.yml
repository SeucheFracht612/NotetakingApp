name: Temporary TipTap lockfile refresh
on:
  push:
    branches: [feat/slice-3-rich-text]
    paths:
      - .github/workflows/refresh-editor-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --save-exact --workspace @notetaking/web @tiptap/react@3.31.3 @tiptap/pm@3.31.3 @tiptap/starter-kit@3.31.3
      - run: npm audit --audit-level=high
      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json package-lock.json
          git commit -m "chore: lock TipTap editor dependencies"
          git push
