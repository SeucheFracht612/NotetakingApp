# Temporary bootstrap job: emits package-lock.json so it can be committed
# through the GitHub connector, then this workflow will be deleted.
name: Temporary dependency lock bootstrap
on:
  push:
    branches: ['feat/slice-0-foundation']

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit public lockfile
        run: |
          echo 'LOCK_BOOTSTRAP_START'
          base64 -w 0 package-lock.json
          echo
          echo 'LOCK_BOOTSTRAP_END'
